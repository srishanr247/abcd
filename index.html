<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOCKSHOT</title>
<style>
  :root { --accent:#ffcf3f; --navy:#10151d; --paper:#f1efe9; --mut:#97a3b1; --red:#ff4d5a; --xc:#3ff5d9; --gap:4px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#9cc4ee; color:var(--paper);
    font-family:"Bahnschrift","DIN Alternate","Arial Narrow",system-ui,sans-serif; user-select:none; -webkit-user-select:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #names { pointer-events:none; }
  .hidden { display:none !important; }

  #hud { position:fixed; inset:0; pointer-events:none; }
  #xh { position:fixed; left:50%; top:50%; width:0; height:0; }
  #xh i { position:absolute; background:var(--xc); box-shadow:0 0 0 1px rgba(0,0,0,.7); }
  #xh .t { width:2px; height:7px; left:-1px; top:calc(-7px - var(--gap)); }
  #xh .b { width:2px; height:7px; left:-1px; top:var(--gap); }
  #xh .l { width:7px; height:2px; top:-1px; left:calc(-7px - var(--gap)); }
  #xh .r { width:7px; height:2px; top:-1px; left:var(--gap); }
  #xh .dot { width:2px; height:2px; left:-1px; top:-1px; }
  #hit { position:fixed; left:50%; top:50%; opacity:0; transition:opacity .25s; }
  #hit i { position:absolute; width:9px; height:3px; left:-4px; top:-1px; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.6); }
  #hit i:nth-child(1){ transform:rotate(45deg) translateX(13px); } #hit i:nth-child(2){ transform:rotate(135deg) translateX(13px); }
  #hit i:nth-child(3){ transform:rotate(225deg) translateX(13px); } #hit i:nth-child(4){ transform:rotate(315deg) translateX(13px); }
  #hit.head i { background:var(--red); }
  #hit.on { opacity:1; transition:none; }
  #scope { position:fixed; inset:0; display:none; background:radial-gradient(circle at 50% 50%, transparent 0, transparent 31vh, #000 31.4vh); }
  #scope::before, #scope::after { content:""; position:absolute; background:#000; }
  #scope::before { left:0; right:0; top:50%; height:1px; } #scope::after { top:0; bottom:0; left:50%; width:1px; }
  #dmg { position:fixed; inset:0; background:radial-gradient(ellipse at center, transparent 45%, rgba(255,40,60,.7) 100%); opacity:0; transition:opacity .5s; }
  #dmg.on { opacity:1; transition:none; }
  #dmgdir { position:fixed; left:50%; top:50%; width:0; height:0; opacity:0; transition:opacity .8s; }
  #dmgdir::after { content:""; position:absolute; left:-16px; top:-170px; border:16px solid transparent; border-bottom:30px solid rgba(255,70,85,.95); }
  #dmgdir.on { opacity:1; transition:none; }

  #top { position:fixed; left:50%; top:10px; transform:translateX(-50%); display:flex; gap:14px; align-items:center; font-weight:700; letter-spacing:.12em; text-shadow:0 2px 4px rgba(0,0,0,.7); }
  #timer { font-size:30px; background:rgba(16,21,29,.75); padding:2px 16px; }
  #kills { font-size:18px; background:rgba(16,21,29,.75); padding:6px 12px; color:var(--accent); }
  #stats { position:fixed; left:10px; top:8px; font:12px/1.4 ui-monospace,Menlo,Consolas,monospace; color:#fff; text-shadow:0 1px 2px #000; white-space:pre; }
  #feed { position:fixed; right:14px; top:14px; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  #feed div { background:rgba(16,21,29,.8); padding:4px 10px; border-left:3px solid var(--accent); font-size:15px; letter-spacing:.05em; }
  #feed div.me { border-color:var(--red); background:rgba(70,16,24,.85); }
  #toast { position:fixed; left:50%; top:20%; transform:translateX(-50%); font-size:26px; letter-spacing:.14em; text-shadow:0 2px 6px #000; opacity:0; transition:opacity .4s; text-transform:uppercase; }
  #toast.on { opacity:1; transition:none; }
  #deadmsg { position:fixed; left:50%; top:38%; transform:translateX(-50%); font-size:34px; letter-spacing:.14em; text-shadow:0 2px 8px #000; text-align:center; }
  #deadmsg small { display:block; font-size:16px; color:#ddd; letter-spacing:.2em; margin-top:6px; }

  .panel { position:fixed; background:rgba(16,21,29,.78); padding:8px 14px; }
  #hp { left:14px; bottom:14px; width:260px; }
  #hpbar { height:14px; background:rgba(255,255,255,.14); margin-top:4px; }
  #hpfill { height:100%; width:100%; background:#4be07a; transition:width .1s; }
  #hptxt { font-size:30px; font-weight:700; line-height:1; }
  #ammoBox { right:14px; bottom:14px; text-align:right; }
  #wname { font-size:13px; letter-spacing:.24em; color:var(--mut); }
  #ammo { font-size:44px; font-weight:700; line-height:1; }
  #ammo small { font-size:15px; color:var(--mut); letter-spacing:.1em; }
  #slots { left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:6px; padding:6px; }
  #slots div { min-width:84px; padding:6px 8px; text-align:center; font-size:13px; letter-spacing:.1em; border:1px solid rgba(255,255,255,.18); color:var(--mut); }
  #slots div.on { background:var(--accent); color:#111; border-color:var(--accent); font-weight:700; }

  #sb { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(560px, 92vw); background:rgba(16,21,29,.92); padding:16px 20px; }
  table { border-collapse:collapse; width:100%; font-size:16px; }
  th { text-align:left; font-size:12px; letter-spacing:.2em; color:var(--mut); padding:3px 4px; }
  td { padding:4px; } tr.me td { color:var(--accent); font-weight:700; } td:nth-child(n+3), th:nth-child(n+3) { text-align:right; }

  #menu, #end { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(8,12,20,.6); backdrop-filter:blur(4px); overflow:auto; }
  .card { width:min(760px, calc(100vw - 28px)); background:var(--navy); border:1px solid rgba(255,255,255,.12); padding:26px 30px; margin:14px; }
  .card h1 { font-size:56px; letter-spacing:.14em; line-height:1; } .card h1 span { color:var(--accent); }
  .sub { color:var(--mut); letter-spacing:.2em; text-transform:uppercase; font-size:13px; margin:6px 0 18px; }
  .big { width:100%; padding:15px; background:var(--accent); border:0; color:#111; font:inherit; font-size:22px; font-weight:700; letter-spacing:.2em; cursor:pointer; }
  .big:hover { filter:brightness(1.08); }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:26px; margin-top:20px; }
  @media (max-width:700px){ .cols { grid-template-columns:1fr; } }
  .cols h3 { font-size:13px; letter-spacing:.24em; color:var(--xc); margin-bottom:8px; }
  .keys td { padding:2px 0; font-size:14px; color:#d8d4cc; } .keys td:first-child { color:#fff; font-weight:700; width:40%; letter-spacing:.05em; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:9px; font-size:14px; }
  .row label { min-width:110px; color:#d8d4cc; } .row input[type=range] { flex:1; accent-color:var(--accent); }
  .row output { width:44px; text-align:right; color:#fff; font-variant-numeric:tabular-nums; }
  select { background:#1a2430; color:#fff; border:1px solid rgba(255,255,255,.2); padding:5px 8px; font:inherit; }
  #err { position:fixed; left:10px; right:10px; bottom:10px; max-height:46vh; overflow:auto; background:rgba(60,0,10,.95); color:#ffd7dc; font:12px/1.4 ui-monospace,Menlo,Consolas,monospace; padding:12px 14px; white-space:pre-wrap; border:1px solid var(--red); z-index:50; user-select:text; -webkit-user-select:text; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="names"></canvas>

<div id="hud" class="hidden">
  <div id="xh"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="dot"></i></div>
  <div id="hit"><i></i><i></i><i></i><i></i></div>
  <div id="scope"></div><div id="dmg"></div><div id="dmgdir"></div>
  <div id="stats"></div>
  <div id="top"><span id="timer">3:00</span><span id="kills">0 KILLS</span></div>
  <div id="feed"></div><div id="toast"></div>
  <div id="deadmsg" class="hidden"></div>
  <div id="hp" class="panel"><div id="hptxt">100</div><div id="hpbar"><div id="hpfill"></div></div></div>
  <div id="ammoBox" class="panel"><div id="wname">AR</div><div id="ammo">30</div></div>
  <div id="slots" class="panel"></div>
  <div id="sb" class="hidden"></div>
</div>

<div id="menu">
  <div class="card">
    <h1>BLOCK<span>SHOT</span></h1>
    <div class="sub">Instant-play deathmatch · 3 minutes · most kills wins</div>
    <button id="play" class="big">CLICK TO PLAY</button>
    <div class="cols">
      <div>
        <h3>CONTROLS</h3>
        <table class="keys">
          <tr><td>WASD</td><td>Move</td></tr><tr><td>MOUSE</td><td>Aim · LMB shoot · RMB zoom</td></tr>
          <tr><td>SHIFT</td><td>Sprint</td></tr><tr><td>SPACE / C</td><td>Jump / Crouch</td></tr>
          <tr><td>1 2 3 4</td><td>AR · SMG · Shotgun · Sniper</td></tr><tr><td>WHEEL / Q</td><td>Switch weapon / last weapon</td></tr>
          <tr><td>R</td><td>Reload</td></tr><tr><td>TAB</td><td>Scoreboard</td></tr><tr><td>ESC</td><td>Pause</td></tr>
        </table>
      </div>
      <div>
        <h3>SETTINGS</h3>
        <div class="row"><label for="sens">Sensitivity</label><input id="sens" type="range" min="0.1" max="3" step="0.05"><output id="sensV"></output></div>
        <div class="row"><label for="fov">Field of view</label><input id="fov" type="range" min="80" max="120" step="1"><output id="fovV"></output></div>
        <div class="row"><label for="bots">Bots</label><input id="bots" type="range" min="2" max="10" step="1"><output id="botsV"></output></div>
        <div class="row"><label for="skill">Bot skill</label><select id="skill"><option value="0.6">Easy</option><option value="1">Normal</option><option value="1.5">Hard</option></select></div>
        <div class="row"><label for="sound">Sound</label><input id="sound" type="checkbox"></div>
        <div class="row"><label for="fps">Show FPS</label><input id="fps" type="checkbox"></div>
      </div>
    </div>
  </div>
</div>

<div id="end" class="hidden">
  <div class="card">
    <h1 id="endTitle">MATCH OVER</h1>
    <div class="sub" id="endSub"></div>
    <div id="endTable"></div>
    <button id="again" class="big" style="margin-top:18px">PLAY AGAIN</button>
  </div>
</div>
<pre id="err" class="hidden"></pre>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
function showError(msg) { const e = $('err'); e.classList.remove('hidden'); e.textContent += msg + '\n'; console.error(msg); }

/* ===================== settings ===================== */
const S = { sens: 0.6, fov: 100, bots: 7, skill: 1, sound: true, fps: true };
try { Object.assign(S, JSON.parse(localStorage.getItem('blockshotSettings') || '{}')); } catch (e) {}
const saveSettings = () => { try { localStorage.setItem('blockshotSettings', JSON.stringify(S)); } catch (e) {} };

/* ===================== voxel world (64 x 20 x 64 m, 0.5 m voxels) ===================== */
const NX = 128, NY = 40, NZ = 128, VS = 0.5, GROUND = 0.5;
const vox = new Uint8Array(NX * NY * NZ);
const inb = (i, j, k) => i >= 0 && j >= 0 && k >= 0 && i < NX && j < NY && k < NZ;
const setV = (i, j, k, id) => { if (inb(i, j, k)) vox[i + NX * (j + NY * k)] = id; };
function box(x0, z0, x1, z1, y0, y1, id) {
  const i0 = Math.round(x0 / VS), i1 = Math.round(x1 / VS), k0 = Math.round(z0 / VS), k1 = Math.round(z1 / VS);
  const j0 = Math.round(y0 / VS) + 1, j1 = Math.round(y1 / VS) + 1;
  for (let k = k0; k < k1; k++) for (let j = j0; j < j1; j++) for (let i = i0; i < i1; i++) setV(i, j, k, id);
}
function floorPatch(x0, z0, x1, z1, id) {
  for (let k = Math.round(z0 / VS); k < Math.round(z1 / VS); k++) for (let i = Math.round(x0 / VS); i < Math.round(x1 / VS); i++) setV(i, 0, k, id);
}
function wallX(x, z0, z1, d0, d1, h) { box(x, z0, x + 1, d0, 0, h, 2); box(x, d1, x + 1, z1, 0, h, 2); box(x, d0, x + 1, d1, 4.5, h, 2); }

// materials: 1 concrete, 2 plaster, 3 steel, 4 wood, 5 light, 6 red, 7 teal, 8 chrome, 9 tile
function buildMap() {
  vox.fill(0);
  for (let k = 0; k < NZ; k++) for (let i = 0; i < NX; i++) setV(i, 0, k, 1);
  box(0, 0, 64, 1, 0, 8, 2); box(0, 63, 64, 64, 0, 8, 2); box(0, 0, 1, 64, 0, 8, 2); box(63, 0, 64, 64, 0, 8, 2);
  wallX(18, 1, 14, 6, 10, 6); wallX(45, 1, 14, 6, 10, 6);
  floorPatch(26, 4, 38, 10, 3); box(24, 1, 40, 1.5, 4, 4.5, 5);
  wallX(15, 14, 40, 26, 30, 6); wallX(25, 14, 40, 20, 24, 6); wallX(38, 14, 40, 20, 24, 6); wallX(48, 14, 40, 26, 30, 6);
  for (const [a, b] of [[1, 8], [14, 17], [23, 29], [35, 41], [47, 50], [56, 63]]) box(a, 40, b, 41, 0, 6, 2);
  box(14.5, 16, 15, 22, 3, 3.5, 5); box(14.5, 32, 15, 38, 3, 3.5, 5); box(16, 30, 16.5, 36, 3, 3.5, 5);
  box(24.5, 26, 25, 36, 3, 3.5, 5); box(39, 26, 39.5, 36, 3, 3.5, 5); box(48.5, 32, 49, 38, 3, 3.5, 5);
  box(18, 28, 20, 30, 0, 1, 4); box(21, 18, 23, 19, 0, 1.5, 4); box(20, 34, 22, 36, 0, 1, 4);
  box(41, 28, 43, 30, 0, 1, 4); box(44, 18, 46, 19, 0, 1.5, 4); box(42, 34, 44, 36, 0, 1, 4);
  box(29, 22, 31, 24, 0, 1.5, 4); box(33, 28, 35, 30, 0, 1, 4); box(30, 34, 32, 36, 0, 1, 4); box(31, 26, 32, 27, 0, 3, 3);
  box(5, 20, 8, 22, 0, 1, 4); box(9, 30, 11, 31, 0, 2, 4); box(54, 20, 57, 22, 0, 1, 4); box(52, 30, 54, 31, 0, 2, 4);
  floorPatch(4, 44, 22, 60, 7);
  box(8, 46, 10, 48, 0, 1, 4); box(14, 54, 16, 56, 0, 1, 4); box(14, 54, 15, 55, 1, 2, 4); box(4, 57, 6, 59, 0, 1.5, 4);
  box(2, 50, 6, 62, 0, 1, 2); box(6, 52, 7, 56, 0, 0.5, 2);
  box(10, 42, 23, 53, 5, 5.5, 2);
  for (const [x, z] of [[10, 42], [22, 42], [10, 52], [22, 52]]) box(x, z, x + 1, z + 1, 0, 5, 3);
  box(13, 46, 19, 47, 4.5, 5, 5); box(18, 58, 19, 59, 0, 6, 3);
  floorPatch(42, 44, 62, 62, 9); floorPatch(48, 48, 56, 56, 6);
  box(44, 46, 46, 48, 0, 1.5, 4); box(58, 46, 60, 48, 0, 1, 4); box(58, 46, 59, 47, 1, 1.5, 4); box(50, 58, 52, 60, 0, 1, 4);
  box(46, 50, 62, 62, 5, 5.5, 2);
  for (const [x, z] of [[46, 50], [54, 50], [46, 60], [54, 60]]) box(x, z, x + 1, z + 1, 0, 5, 3);
  box(48, 54, 60, 55, 4.5, 5, 5); box(48, 58, 60, 59, 4.5, 5, 5); box(62, 50, 63, 58, 1, 4, 8);
  box(28, 52, 36, 53, 0, 1, 2); box(30, 56, 34, 58, 0, 2, 4);
}
buildMap();

/* ===================== ray casting + collision (CPU) ===================== */
function raycast(ox, oy, oz, dx, dy, dz, maxT) {
  const px = ox / VS, py = oy / VS, pz = oz / VS;
  let ix = Math.floor(px), iy = Math.floor(py), iz = Math.floor(pz);
  const sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1, sz = dz > 0 ? 1 : -1;
  const tdx = dx !== 0 ? Math.abs(1 / dx) : Infinity, tdy = dy !== 0 ? Math.abs(1 / dy) : Infinity, tdz = dz !== 0 ? Math.abs(1 / dz) : Infinity;
  let tmx = dx !== 0 ? (dx > 0 ? ix + 1 - px : px - ix) * tdx : Infinity;
  let tmy = dy !== 0 ? (dy > 0 ? iy + 1 - py : py - iy) * tdy : Infinity;
  let tmz = dz !== 0 ? (dz > 0 ? iz + 1 - pz : pz - iz) * tdz : Infinity;
  const maxG = maxT / VS;
  let t = 0, nx = 0, ny = 0, nz = 0;
  for (let n = 0; n < 700; n++) {
    if (!inb(ix, iy, iz)) return null;
    const id = vox[ix + NX * (iy + NY * iz)];
    if (id) return { t: t * VS, nx, ny, nz, i: ix, j: iy, k: iz, id };
    if (tmx < tmy) {
      if (tmx < tmz) { t = tmx; if (t > maxG) return null; ix += sx; tmx += tdx; nx = -sx; ny = 0; nz = 0; }
      else { t = tmz; if (t > maxG) return null; iz += sz; tmz += tdz; nx = 0; ny = 0; nz = -sz; }
    } else {
      if (tmy < tmz) { t = tmy; if (t > maxG) return null; iy += sy; tmy += tdy; nx = 0; ny = -sy; nz = 0; }
      else { t = tmz; if (t > maxG) return null; iz += sz; tmz += tdz; nx = 0; ny = 0; nz = -sz; }
    }
  }
  return null;
}
function rayAABB(o, d, mn, mx) {
  let t0 = 0, t1 = 1e9;
  for (let a = 0; a < 3; a++) {
    if (Math.abs(d[a]) < 1e-9) { if (o[a] < mn[a] || o[a] > mx[a]) return -1; continue; }
    const inv = 1 / d[a]; let ta = (mn[a] - o[a]) * inv, tb = (mx[a] - o[a]) * inv;
    if (ta > tb) { const s = ta; ta = tb; tb = s; }
    if (ta > t0) t0 = ta; if (tb < t1) t1 = tb;
    if (t0 > t1) return -1;
  }
  return t0;
}
const solid = (i, j, k) => (i < 0 || k < 0 || j < 0 || i >= NX || k >= NZ) ? true : (j >= NY ? false : vox[i + NX * (j + NY * k)] !== 0);
function boxHit(x, y, z, half, h) {
  const e = 0.001;
  const i0 = Math.floor((x - half + e) / VS), i1 = Math.floor((x + half - e) / VS);
  const j0 = Math.floor((y + e) / VS), j1 = Math.floor((y + h - e) / VS);
  const k0 = Math.floor((z - half + e) / VS), k1 = Math.floor((z + half - e) / VS);
  for (let k = k0; k <= k1; k++) for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) if (solid(i, j, k)) return true;
  return false;
}
function moveHoriz(e, dx, dz, half, h, canStep) {
  let blocked = false;
  if (dx !== 0) {
    const nx = e.x + dx;
    if (!boxHit(nx, e.y, e.z, half, h)) e.x = nx;
    else if (canStep && !boxHit(nx, e.y + VS, e.z, half, h)) { e.x = nx; e.y += VS; }
    else { e.vx = 0; blocked = true; }
  }
  if (dz !== 0) {
    const nz = e.z + dz;
    if (!boxHit(e.x, e.y, nz, half, h)) e.z = nz;
    else if (canStep && !boxHit(e.x, e.y + VS, nz, half, h)) { e.z = nz; e.y += VS; }
    else { e.vz = 0; blocked = true; }
  }
  return blocked;
}
function moveVert(e, dy, half, h) {
  const n = Math.max(1, Math.ceil(Math.abs(dy) / 0.2)), sd = dy / n;
  for (let s = 0; s < n; s++) {
    const ny = e.y + sd;
    if (boxHit(e.x, ny, e.z, half, h)) { if (sd < 0) e.y = Math.floor(e.y / VS + 1e-6) * VS; e.vy = 0; return; }
    e.y = ny;
  }
}

/* ===================== navigation grid + A* for bots (1 m cells) ===================== */
const GW = 64;
const navFree = new Uint8Array(GW * GW);
for (let z = 0; z < GW; z++) for (let x = 0; x < GW; x++) navFree[x + GW * z] = boxHit(x + 0.5, GROUND, z + 0.5, 0.42, 1.9) ? 0 : 1;
const cellOf = (x, z) => clamp(Math.floor(x), 0, GW - 1) + GW * clamp(Math.floor(z), 0, GW - 1);
function nearestFree(x, z) {
  const cx = clamp(Math.floor(x), 0, GW - 1), cz = clamp(Math.floor(z), 0, GW - 1);
  if (navFree[cx + GW * cz]) return cx + GW * cz;
  for (let r = 1; r < 4; r++) for (let dz = -r; dz <= r; dz++) for (let dx = -r; dx <= r; dx++) {
    const nx = cx + dx, nz = cz + dz;
    if (nx >= 0 && nz >= 0 && nx < GW && nz < GW && navFree[nx + GW * nz]) return nx + GW * nz;
  }
  return -1;
}
function lineFree(ax, az, bx, bz) {

const MUZZLE = [1.15, 0.9, 1.2, 1.55];

function initGL() {
  gl = canvas.getContext('webgl2', { antialias: true, alpha: false, powerPreference: 'high-performance' });
  if (!gl) throw new Error('WebGL2 is not available in this browser.');
  const sh = (type, src, name) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('Shader error (' + name + '):\n' + gl.getShaderInfoLog(s)); return s; };
  const prog = (vs, fs, name) => { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs, name + ' vs')); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs, name + ' fs')); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Link error (' + name + '):\n' + gl.getProgramInfoLog(p)); return p; };
  const geoVS = `#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aCol;
uniform mat4 uVP;
uniform vec3 uCam;
out vec3 vCol;
out float vDist;
void main() {
  gl_Position = uVP * vec4(aPos, 1.0);
  vCol = aCol;
  vDist = length(aPos - uCam);
}`;
  const geoFS = `#version 300 es
precision mediump float;
in vec3 vCol;
in float vDist;
uniform vec3 uFog;
uniform vec2 uFogRange;
out vec4 outColor;
void main() {
  float f = smoothstep(uFogRange.x, uFogRange.y, vDist);
  outColor = vec4(mix(vCol, uFog, f), 1.0);
}`;
  const skyVS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.999, 1.0);
}`;
  const skyFS = `#version 300 es
precision mediump float;
uniform vec2 uRes;
uniform vec3 uTop;
uniform vec3 uHor;
out vec4 outColor;
void main() {
  float t = clamp(gl_FragCoord.y / uRes.y, 0.0, 1.0);
  outColor = vec4(mix(uHor, uTop, smoothstep(0.35, 1.0, t)), 1.0);
}`;
  gl.pGeo = prog(geoVS, geoFS, 'geometry'); gl.pSky = prog(skyVS, skyFS, 'sky');
  gl.uGeo = { vp: gl.getUniformLocation(gl.pGeo, 'uVP'), cam: gl.getUniformLocation(gl.pGeo, 'uCam'), fog: gl.getUniformLocation(gl.pGeo, 'uFog'), range: gl.getUniformLocation(gl.pGeo, 'uFogRange') };
  gl.uSky = { res: gl.getUniformLocation(gl.pSky, 'uRes'), top: gl.getUniformLocation(gl.pSky, 'uTop'), hor: gl.getUniformLocation(gl.pSky, 'uHor') };

  const attribs = () => { gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0); gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12); };
  const mesh = buildWorldMesh();
  gl.worldN = mesh.idx.length;
  gl.worldVao = gl.createVertexArray(); gl.bindVertexArray(gl.worldVao);
  gl.worldVbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, gl.worldVbo); gl.bufferData(gl.ARRAY_BUFFER, mesh.verts, gl.STATIC_DRAW);
  attribs();
  gl.worldIbo = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.worldIbo); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.idx, gl.STATIC_DRAW);

  const bi = new Uint16Array(MAXB * 36);
  for (let b = 0; b < MAXB * 6; b++) { const v = b * 4, o = b * 6; bi[o] = v; bi[o + 1] = v + 1; bi[o + 2] = v + 2; bi[o + 3] = v; bi[o + 4] = v + 2; bi[o + 5] = v + 3; }
  gl.boxIbo = gl.createBuffer();
  gl.dynBatch = makeBatch(); gl.gunBatch = makeBatch();
  for (const bt of [gl.dynBatch, gl.gunBatch]) {
    bt.vao = gl.createVertexArray(); gl.bindVertexArray(bt.vao);
    bt.vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bt.vbo); gl.bufferData(gl.ARRAY_BUFFER, bt.data.byteLength, gl.DYNAMIC_DRAW);
    attribs();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.boxIbo); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, bi, gl.STATIC_DRAW);
  }
  gl.emptyVao = gl.createVertexArray();
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  gl.gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'GPU';
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  ok = true; resize();
}
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = Math.floor(innerWidth * dpr); canvas.height = Math.floor(innerHeight * dpr);
  ncv.width = innerWidth; ncv.height = innerHeight;
}
addEventListener('resize', resize);

function drawBatch(bt) {
  if (!bt.n) return;
  gl.bindVertexArray(bt.vao); gl.bindBuffer(gl.ARRAY_BUFFER, bt.vbo);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, bt.data, 0, bt.n * 144);
  gl.drawElements(gl.TRIANGLES, bt.n * 36, gl.UNSIGNED_SHORT, 0);
}
const hash01 = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };

function render() {
  if (!ok) return;
  const w = canvas.width, h = canvas.height, asp = w / h;
  const eye = eyePos(), B = basis(P.yaw, P.pitch);
  const fovy = 2 * Math.atan(Math.tan(S.fov * Math.PI / 360) / asp) / zoomCur;   // S.fov is horizontal
  const VP = mul(persp(fovy, asp, 0.05, 220), viewMat(eye, B));
  gl.viewport(0, 0, w, h);
  gl.clearColor(SKY_HOR[0], SKY_HOR[1], SKY_HOR[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(gl.pSky); gl.uniform2f(gl.uSky.res, w, h); gl.uniform3fv(gl.uSky.top, SKY_TOP); gl.uniform3fv(gl.uSky.hor, SKY_HOR);
  gl.bindVertexArray(gl.emptyVao); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST);

  gl.useProgram(gl.pGeo);
  gl.uniform3fv(gl.uGeo.cam, eye); gl.uniform3fv(gl.uGeo.fog, SKY_HOR); gl.uniform2f(gl.uGeo.range, 45, 120);
  gl.uniformMatrix4fv(gl.uGeo.vp, false, VP);
  gl.bindVertexArray(gl.worldVao); gl.drawElements(gl.TRIANGLES, gl.worldN, gl.UNSIGNED_INT, 0);

  // moving things
  const bt = gl.dynBatch; bt.n = 0;
  for (const b of bots) if (b.alive || b.deadT < 2.2) drawBotModel(bt, b);
  for (const f of fx) { const s = f.s * Math.max(0.3, f.life / f.max); pushBox(bt, f.x, f.y, f.z, X_, Y_, Z_, s, s, s, f.c, true); }
  for (const m of beams) {
    const dx = m.x1 - m.x0, dy = m.y1 - m.y0, dz = m.z1 - m.z0, L = Math.hypot(dx, dy, dz); if (L < 0.01) continue;
    const ez = [dx / L, dy / L, dz / L];
    let ex = [ez[2], 0, -ez[0]]; const xl = Math.hypot(ex[0], ex[2]); ex = xl > 1e-4 ? [ex[0] / xl, 0, ex[2] / xl] : [1, 0, 0];
    const ey = [ez[1] * ex[2] - ez[2] * ex[1], ez[2] * ex[0] - ez[0] * ex[2], ez[0] * ex[1] - ez[1] * ex[0]];
    const wd = 0.012 * (m.life / 0.07 + 0.3);
    pushBox(bt, (m.x0 + m.x1) / 2, (m.y0 + m.y1) / 2, (m.z0 + m.z1) / 2, ex, ey, ez, wd, wd, L / 2, [1, 0.92, 0.55], true);
  }
  drawBatch(bt);

  // first-person gun, drawn on top with its own projection
  const gb = gl.gunBatch; gb.n = 0;
  const scoped = cur === 3 && zoomOn && zoomCur > 2;
  if (P.alive && !scoped) {
    const sp = Math.hypot(P.vx, P.vz), bob = P.onGround ? Math.min(sp / RUN, 1.3) * (sprinting ? 1.4 : 1) : 0.15, tt = performance.now() / 1000;
    const ads = zoomOn ? Math.min(1, (zoomCur - 1) / Math.max(0.05, W[cur].zoom[0] - 1)) : 0;
    let ox = Math.cos(tt * 5.2) * 0.006 * bob - 0.17 * ads, oy = Math.sin(tt * 10.4) * 0.006 * bob - 0.003 + 0.03 * ads, oz = -kickBack;
    if (reloading) oy -= 0.24 * Math.sin(clamp(1 - reloadT / W[cur].reload, 0, 1) * Math.PI);
    if (switchT > 0) oy -= 0.36 * (switchT / 0.28);
    if (sprinting && P.onGround) { oy -= 0.05; ox -= 0.06; }
    for (const g of GUNS[cur]) {
      const hx = (g[3] - g[0]) / 2, hy = (g[4] - g[1]) / 2, hz = (g[5] - g[2]) / 2;
      pushBox(gb, (g[0] + g[3]) / 2 + ox, (g[1] + g[4]) / 2 + oy, (g[2] + g[5]) / 2 + oz, X_, Y_, Z_, hx, hy, hz, [g[6], g[7], g[8]], false);
    }
    if (flashT > 0) { const s = 0.05 + 0.04 * hash01(time * 60); pushBox(gb, 0.215 + ox, -0.18 + oy, MUZZLE[cur] + 0.06 + oz, X_, Y_, Z_, s, s, 0.05, [1, 0.85, 0.35], true); }
  }
  if (gb.n) {
    gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.uniformMatrix4fv(gl.uGeo.vp, false, mul(persp(1.05, asp, 0.03, 10), FLIPZ));
    gl.uniform3f(gl.uGeo.cam, 0, 0, 0); gl.uniform2f(gl.uGeo.range, 1e5, 1e6);
    drawBatch(gb);
  }
  drawNameTags(VP);
}

function drawNameTags(VP) {
  nctx.clearRect(0, 0, ncv.width, ncv.height);
  if (!locked || !P.alive) return;
  const eye = eyePos();
  nctx.textAlign = 'center'; nctx.font = '700 13px system-ui, sans-serif';
  for (const b of bots) {
    if (!b.alive) continue;
    const dx = b.x - eye[0], dy = b.y + 2.1 - eye[1], dz = b.z - eye[2], d = Math.hypot(dx, dy, dz);
    if (d > 40) continue;
    const hh = raycast(eye[0], eye[1], eye[2], dx / d, dy / d, dz / d, d);
    if (hh && hh.t < d - 0.3) continue;
    const x = b.x, y = b.y + 2.1, z = b.z;
    const cx = VP[0] * x + VP[4] * y + VP[8] * z + VP[12], cy = VP[1] * x + VP[5] * y + VP[9] * z + VP[13], cw = VP[3] * x + VP[7] * y + VP[11] * z + VP[15];
    if (cw <= 0.1) continue;
    const sx = (cx / cw * 0.5 + 0.5) * ncv.width, sy = (1 - (cy / cw * 0.5 + 0.5)) * ncv.height;
    nctx.fillStyle = 'rgba(0,0,0,.6)'; nctx.fillRect(sx - 26, sy - 3, 52, 6);
    nctx.fillStyle = b.hp > 50 ? '#4be07a' : b.hp > 25 ? '#ffcf3f' : '#ff4d5a'; nctx.fillRect(sx - 25, sy - 2, 50 * b.hp / 100, 4);
    nctx.fillStyle = '#fff'; nctx.shadowColor = '#000'; nctx.shadowBlur = 3; nctx.fillText(b.name, sx, sy - 8); nctx.shadowBlur = 0;
  }
}

/* ===================== HUD refresh ===================== */
const cache = {};
const setText = (node, key, v) => { if (cache[key] !== v) { cache[key] = v; node.textContent = v; } };
function updateHud(fps, ms) {
  const m = Math.max(0, Math.ceil(match.t));
  setText(el.timer, 'tm', Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'));
  setText(el.kills, 'k', P.kills + ' / ' + KILL_LIMIT + ' KILLS');
  setText(el.hptxt, 'hp', String(Math.max(0, Math.ceil(P.hp))));
  el.hpfill.style.width = clamp(P.hp, 0, 100) + '%'; el.hpfill.style.background = P.hp > 50 ? '#4be07a' : P.hp > 25 ? '#ffcf3f' : '#ff4d5a';
  setText(el.wname, 'wn', W[cur].name + (reloading ? '  ·  RELOADING' : ''));
  setText(el.ammo, 'am', String(ammo[cur]));
  [...el.slots.children].forEach((d, i) => d.classList.toggle('on', i === cur));
  const gap = 3 + spreadDeg(W[cur]) * 7 + kickBack * 40;
  el.xh.style.setProperty('--gap', gap.toFixed(1) + 'px');
  const scoped = cur === 3 && zoomOn && zoomCur > 2;
  el.xh.style.display = scoped ? 'none' : ''; el.scope.style.display = scoped ? 'block' : 'none';
  if (!P.alive) { el.dead.classList.remove('hidden'); el.dead.innerHTML = 'ELIMINATED<small>RESPAWNING IN ' + Math.max(0, Math.ceil(P.respawn)) + '</small>'; } else el.dead.classList.add('hidden');
  el.stats.textContent = S.fps ? Math.round(fps) + ' fps  ' + ms.toFixed(1) + ' ms' : '';
  if (!el.sb.classList.contains('hidden')) el.sb.innerHTML = scoreTable(fighters().slice().sort((a, b) => b.kills - a.kills || a.deaths - b.deaths));
}

/* ===================== input / menu ===================== */
const keys = new Set();
let locked = false;
addEventListener('keydown', e => {
  if (!locked) return;
  if (['Space', 'Tab', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  if (e.repeat) return;
  switch (e.code) {
    case 'Space': P.jumpBuf = 0.12; break;
    case 'Digit1': equip(0); break; case 'Digit2': equip(1); break; case 'Digit3': equip(2); break; case 'Digit4': equip(3); break;
    case 'KeyQ': equip(last); break; case 'KeyR': startReload(); break;
    case 'Tab': el.sb.classList.remove('hidden'); break;
  }
});
addEventListener('keyup', e => { keys.delete(e.code); if (e.code === 'Tab') el.sb.classList.add('hidden'); });
addEventListener('blur', () => { keys.clear(); mouseL = mouseR = false; });
addEventListener('mousemove', e => { if (!locked) return; const k = 0.07 * S.sens * Math.PI / 180 / zoomCur; P.yaw += e.movementX * k; P.pitch = clamp(P.pitch - e.movementY * k, -1.5, 1.5); });
addEventListener('mousedown', e => {
  if (!locked) return;
  if (e.button === 0) { mouseL = true; fireEdge = true; }
  if (e.button === 2) { mouseR = true; if (P.alive && !reloading) zoomOn = cur === 3 ? !zoomOn : true; }
});
addEventListener('mouseup', e => { if (e.button === 0) mouseL = false; if (e.button === 2) { mouseR = false; if (cur !== 3) zoomOn = false; } });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('wheel', e => { if (locked) equip((cur + (e.deltaY > 0 ? 1 : -1) + W.length) % W.length); }, { passive: true });

document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === canvas;
  $('hud').classList.toggle('hidden', !locked);
  if (locked) { $('menu').classList.add('hidden'); $('end').classList.add('hidden'); }
  else { keys.clear(); mouseL = mouseR = false; el.sb.classList.add('hidden'); nctx.clearRect(0, 0, ncv.width, ncv.height); if (match.over) $('end').classList.remove('hidden'); else { $('menu').classList.remove('hidden'); $('play').textContent = 'RESUME'; } }
});
document.addEventListener('pointerlockerror', () => showError('The browser refused pointer lock. Click the page once and try again.'));
function play() { audio(); if (!match.started || match.over) startMatch(); try { canvas.requestPointerLock(); } catch (e) { showError('Pointer lock failed: ' + e.message); } }
$('play').addEventListener('click', play);
$('again').addEventListener('click', play);

function syncUi() {
  $('sens').value = S.sens; $('sensV').textContent = (+S.sens).toFixed(2); $('fov').value = S.fov; $('fovV').textContent = S.fov + '°';
  $('bots').value = S.bots; $('botsV').textContent = S.bots; $('skill').value = String(S.skill); $('sound').checked = S.sound; $('fps').checked = S.fps;
}
$('sens').oninput = e => { S.sens = +e.target.value; syncUi(); saveSettings(); };
$('fov').oninput = e => { S.fov = +e.target.value; syncUi(); saveSettings(); };
$('bots').oninput = e => { S.bots = +e.target.value; syncUi(); saveSettings(); match.started = false; };   // applies on next match start
$('skill').onchange = e => { S.skill = +e.target.value; saveSettings(); };
$('sound').onchange = e => { S.sound = e.target.checked; saveSettings(); };
$('fps').onchange = e => { S.fps = e.target.checked; saveSettings(); };
syncUi();

/* ===================== main loop ===================== */
startMatch(); match.started = false;
let lastT = performance.now(), accMs = 0, accN = 0, fpsShow = 60, msShow = 16, hudT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (locked) updateAll(Math.min(raw, 1 / 20));
  try { render(); } catch (e) { ok = false; showError('Render error: ' + (e && e.message)); }
  accMs += raw * 1000; accN++;
  if (accMs > 500) { msShow = accMs / accN; fpsShow = 1000 / msShow; accMs = 0; accN = 0; }
  hudT += raw; if (locked && hudT > 0.05) { hudT = 0; updateHud(fpsShow, msShow); }
}
try { initGL(); } catch (e) { showError(e.message); }
requestAnimationFrame(frame);

/* test hook placeholder */
})();
</script>
